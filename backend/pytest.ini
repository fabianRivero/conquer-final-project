[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
testpaths = tests
python_classes = Test*
python_functions = test_*

# `pytest` is not on PATH on the CI host, so the command form is always
# `python -m pytest`.
addopts = --strict-markers

markers =
    unit: pure domain rules, no database, by construction.
    integration: the Django test client against PostgreSQL 16, never SQLite.
    e2e: the deployed public URL.
