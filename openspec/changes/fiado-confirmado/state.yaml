      Rule 19 and ADR-26: every seeded `pago` is smaller than the debt
      it retires, so no customer holds a credit. The seed is a legal
      book and not an example of one.
    the_deletion_is_the_only_one_in_the_codebase: >-
      The seed deletes the demo shop and recreates it, and that deletion
      is confined to `is_demo=True`: the shop is looked up by the FLAG
      and not by a name or an id, and every statement filters on the
      shop's id. A shop that is not the demo one, its customers and its
      book are untouched - and there is a test that says so.

      The mechanism lives in `models.borrar_dataset_demo`, so there is
      exactly ONE place in the codebase that can remove an append-only
      row. It goes UNDERNEATH the ORM on purpose: the append-only guard
      is absolute on `instance.delete()`, `QuerySet.delete()` and
      `QuerySet.update()`, and Django's collector refuses to collect
      the append-only rows that hang off a shop - so the deletion cannot
      be done through the ORM at all. The guard is an ORM-level guard:
      the schema has no trigger and no rule against removing these rows.

      Three facts, all read from the PostgreSQL catalog rather than
      assumed: every foreign key of this database is `NO ACTION`,
      because Django emulates CASCADE in the ORM; every one of them is
      `DEFERRABLE INITIALLY DEFERRED`, so the constraint is checked at
      the END OF THE TRANSACTION and the order of the deletions does not
      matter; and `information_schema.constraint_column_usage` returns
      no row for some foreign keys, so the tables are discovered with
      `pg_constraint` instead - the first version of the discovery
      returned an EMPTY set and the seed deleted nothing at all.

      The ids are captured before anything is deleted, because a table
      that hangs off another one is found by its parent's ids, and those
      ids have to be read while the parent rows are still there.
