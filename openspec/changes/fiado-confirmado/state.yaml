    the_decision: >-
      The person creates her own account, she chose the username and the
      password, and she is the only one who changes them. The shop
      neither issues them nor knows them. A person can hold debt in
      SEVERAL shops. It is a **product decision under a declared
      hypothesis**, not field evidence: the validation round with the
      shop owners has not been run, and the project's `knowledge_basis`
      stays `design-hypothesis`.
    the_three_audiences: >-
      The staff signs in at `/login/` with the credentials the shop gave
      them, and their session carries the `shop_id` - the scope of the
      shop. The client reads with a credential and has no session. The
      person signs in here, with her own credentials, and **her session
      carries no `shop_id`**: a person is not in a shop. That absence is
      what keeps her session away from the staff routes, and the two
      tests that carry the boundary assert it in BOTH directions.
    why_the_authenticating_routes_have_no_authentication_class: >-
      `SessionAuthentication` is what enforces the CSRF check, and it
      only runs when the session is what authenticated the request. A
      route whose whole job is to AUTHENTICATE has no session yet, so
      the check has nothing to protect - and the default `IsAuthenticated`
      cannot apply either. It is the one exception, and it is
      documented as such.
    why_those_routes_are_csrf_exempt: >-
      The staff's login is **cookie-based** and carries `@csrf_protect`: a
      third-party page must not be able to sign a member of staff in.
      These routes send the password **in the body**, and a cookie says
      nothing about who the person is - the body is the only thing that
      authenticates, and a third-party page cannot read it. The two
      logins are different mechanisms and they carry different contracts.
    the_refusal_is_an_oracle_free_one: >-
      `credenciales_invalidas` is byte-identical for an unknown user and
      for a wrong password. "No such user" is an oracle, and an oracle is
      a way to enumerate accounts.
    evidence: >-
