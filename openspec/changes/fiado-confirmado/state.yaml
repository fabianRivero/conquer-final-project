product_decisions:
  - id: reframe-project
    status: confirmed
    by: user
    decision: >-
      The project is replanned from scratch. The fiado confirmed by the client
      becomes the central product, not an addendum to `tienda-barrio`.
  - id: change-identity
    status: confirmed
    by: user
    decision: >-
      New change `fiado-confirmado`. It supersedes `tienda-barrio`, whose
      proposal, specs and design are abandoned rather than amended.
  - id: inventory-depth
    status: confirmed
    by: user
    decision: >-
      Inventory is tracked by movement: a product catalogue with prices, charge
      lines on every cargo, and stock derived from recorded movements.
  - id: client-statement-reading
    status: confirmed
    by: user
    decision: >-
      The client's statement shows confirmed charges in full detail (product,
      quantity, price, confirmation date and time). An unconfirmed charge
      appears as a summary row (date + amount) with a "Confirmar" action, and
      its itemisation is revealed only inside that action. The client always
      sees what they owe; the literal alternative would let the client's own
      page understate the debt.
  - id: research-lane
    status: confirmed
    by: user
    decision: >-
      No external research lane is selected. The owner interviews remain the
      only evidence for the fiado practice, exactly as in the previous change.
  - id: the-documents-describe-the-system-that-exists
    status: confirmed
    by: agent
    decided: '2026-11-26'
    decision: >-
      **The documents had drifted from the code, and the drift was in the
      places the defence reads.** The §2 table of entities did not name
      `Vinculo` - the model the whole account rewrite is built on - and
      still named `CustomerCodigo` and `CodigoIntento`, which the 10.6
      removed. The `Customer` row still claimed a `Shop` and a
      `credit_limit` it had not had since the 10.4. The proposal's
      success criteria still described the retired credential surface and
      two demonstrations the system cannot perform.
    what_it_changes: >-
      The §2 table, its footnote, its constraints and its count; §3.1's
      mutable columns; §3.2's transactional rules; §7's two rows; §7.3's
      scope; §9.1's two routes; §5's header; §10's frontend tree; and
      the proposal's criteria. **And the code that was dead**: the
      `Credenciales` section of the owner's board, which rendered a table
      of "-" with a button that answered 501, is gone.
    how_it_is_made_durable: >-
      `backend/tests/integration/test_entidades.py` pins the §2 table to
      the models, in BOTH directions and with the count - the same shape
      as the route table's test. The drift happened three times and
      nothing failed; now the table cannot drift again.
    what_it_leaves: >-
      The credential's DESIGN history - §5's body, D2-D4, D9, CAC-09 and
      the RED suite - still reads in the present tense. It is history, and
      §5 now says so at its head. The §12 leak list and the §16
      traceability rows that name the credential's decisions are left
      alone on purpose: they are the record of what was decided, not a
      claim about what the system does.

  - id: la-entrega-del-pfm
    status: confirmed
    by: agent
    decided: '2026-11-26'
    decision: >-
      **The three things the success criteria ask for are delivered**: a
      README, a memoria and a defence script.
    what_it_is: >-
      `README.md` (the repository's front door: what it is, how to run it,
      the accounts, the deploy, the tests and - importantly - **what the
      project does NOT claim**). `memoria.md` (the delivery document: the
      problem, the principals, and **§3.1 to §3.8 = the eight
      capabilities**, then the technical approach, the validation with the
      annex, the success criteria and what is not built).
      `defensa.md` (the thirty-minute script: the opening, the four live
      demonstrations with the exact clicks, the architecture in five minutes
      and the ten questions the tribunal will ask).
    the_language: >-
      The README follows the project's language contract (English prose,
      Spanish identifiers); the memoria and the defence script follow the
      proposal, which is the PFM's own Spanish-facing document.
    what_the_script_solved: >-
      **The fourth demonstration was not performable as it was.** The
      criterion asks for a client owing 8,00, 7,00 and 15,00, and the
      seeded demo had ONE debt of 3,60. The script fixes it without
      touching the seed: the catalogue reaches the three totals with TWO
      lines each - Jamon 6,90 + Lechuga 1,10 = 8,00, Queso 4,75 + Tomates
      2,25 = 7,00, and Gambas 12,50 + Cafe 2,50 = 15,00 - so the debts are
      created live, in order, and the FIFO payment lands where the
      criterion says: 8/8, 7/7 and 5/15.

  - id: pa-08-delivered
    status: confirmed
    by: agent
    decided: '2026-11-26'
    decision: >-
      **PA-08 is delivered**: `POST /api/v1/clientes/{cliente_id}/suspension/anular/`
      answers 200, 403 and 404. It was the LAST route in `501`.
    what_it_changes: >-
      **A route, and nothing else.** The service (`services.anular_suspension`)
      already existed and was already tested - the route was the only thing
      missing. The view records the owner's act and returns the state AFTER
      it, with who did it and when: the derived state is never written, and
      the book is never touched.
    what_it_does_not_change: >-
      The model, the rules and the permissions. The suspension is still
      DERIVED (PA-05, PA-06) and the override is still an ACT; the design's
      §9.1 already described this route, because the route was written
      down before it was built.
    the_boundary_it_keeps: >-
      The owner's alone. The `dependiente` reads the credit book but does not
      set the policy, so he gets a total 403 with no data, and the person is
      not an audience of the owner's routes at all. A customer of another
      shop answers 404: a 403 would confirm that it exists.

  - id: existencias-cut
    status: confirmed
    by: user
    decided: '2026-11-26'
    decision: >-
      **Regla 6 is CUT.** The route `POST /api/v1/existencias/` disappears
      and CP-07 (`existencias_registradas` is a ceiling, never a count) is
      declared NOT BUILT. The owner chose it over building the capability:
      the defence is thirty minutes, and every capability is more surface
      to defend and less time to defend it.
    what_it_changes: >-
      The route goes, `VIEWS_PENDIENTES` loses the name, and the design
      says so in §2 (the footnote of the `StockMovement` row), §7 (the
      permission matrix) and §9.1 (the route table). The TABLE stays: the
      `StockMovement` model is empty, nothing writes to it, and dropping
      it would be a destructive migration for nothing.
    what_it_does_not_change: >-
      The domain rule. `existencias_registradas` and its qualifier stay in
      `backend/tienda/domain/stock.py` with their unit tests - the method
      that was available - and they stay documented as the ceiling that
      could be wired if the shop ever wants it.
    why_it_is_not_a_loss: >-
      The proposal listed suppressing `existencias_registricas` as an
      ACCEPTABLE scope reduction ("it is an optional ceiling and no rule
      depends on it"), and no success criterion mentions it. Nothing in
      the four live demonstrations needed it.

  - id: the-person-sees-her-own-limit
    status: confirmed
    by: user
    decided: '2026-11-25'
    decision: >-
      **The implementation wins**: the person DOES see her own
      `credit_limit`, and her own `antiguedad_max_dias`, on an ACCEPTED
      link, per shop. The design said the opposite - D11, CAC-10 and
      ADR-24 said the field must be absent from the client schema
      entirely - and the contract is amended to match the code, which is
      what was already built and shipped.
    what_it_changes: >-
      D11, ADR-24, §5.2's leak-surface row, §7's permission
      matrix, §7.3's attribution of CAC-10, §9.2's enumeration
      of the nine staff-only fields and §15.2's description of the
      tests; CAC-10's requirement and a new scenario; and the guarantee,
      which moves from a SCHEMA to the ROUTES that run. The nine stay
      nine for the client class and the `dependiente`'s reduced schema,
      which declare none of them - and the person is the exception.
    what_it_does_not_change: >-
      **The set of facts the person can read.** The delivered account
      already carried the limit, the frontend already shows it ("Te
      pueden fiar hasta ..."), and the pending link already showed
      nothing. The change is that the CONTRACT now says the truth, and
      that the truth is enforced by a test over the routes instead of
      over a serializer that no live route renders.
      **What DID change in the wire**: the accept response
      (`cuenta/vinculos/aceptar/`) now carries the SAME row as the list
      - `pendiente` and `antiguedad_max_dias` besides the limit - because
      both read one builder (`vinculo_para_la_persona`). It shows her
      nothing the list did not already show her; it makes her view of a
      link independent of the route she came through.
    how_it_is_made_true: >-
      One builder: `vinculo_para_la_persona` in
      `backend/tienda/services.py` writes the row, and both the list and
      the answer to the shop's question use it - so her view of a link
      cannot depend on which URL she came through. The guarantee is
      asserted in `backend/tests/integration/test_cifras_de_la_persona.py`.
  - id: validation-round-not-pursued
    status: confirmed
    by: user
    decided: '2026-11-25'
    decision: >-
      The validation round with shop owners is NOT PURSUED. The owner
      does not consider it necessary. The project's knowledge base stays
      a DECLARED DESIGN HYPOTHESIS, and it stops being a pending
      question: the scope, the gates and the account rewrite are the
      owner's decisions, taken under that hypothesis, and they are not
      waiting for a round that will not happen.
    what_it_changes: >-
      The framing, not the code. The documents said the round "has not
      been run", which reads as pending - something that could still
      happen. It is now closed: the instrument stays as the record of
      the method that was available, the cut mechanism stays documented
      as a contingency that will not be triggered, and the knowledge
      base is declared rather than provisional.
    what_it_does_not_change: >-
      The build. The deliverable's own criteria accept the annex
      unexecuted - the proposal asks for "el anexo de validación
      previsto (ejecutado o no, sin datos inventados)" - and the
      annex is already complete, with its script, its capture sheet and
      its 70 fields empty rather than invented.
    what_it_leaves_unmeasured: >-
      The owner's rule that a client without an account cannot have a
      fiado stays unmeasured against real shops. If a shop grants
      credit to customers who have no account, that rule breaks their
      day - and with the round closed, nothing will ever say so. This
      is recorded, not argued: the decision is the owner's and it stands.

