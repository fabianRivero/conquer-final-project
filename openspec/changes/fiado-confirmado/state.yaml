v2_redesign:
  recorded: '2026-11-07'
  brief: openspec/changes/fiado-confirmado/redesign-brief.md
  decision: >-
    The dispute machinery and the nota de credito are removed. The problem the
    old change solved - the two sides do not have the same figure - is now
    solved by PREVENTION instead of resolution: the owner prepares a fiado
    with its desglose, the client sees it on a screen in the shop and
    confirms it, and only then does the charge exist and become debt. If the
    client does not confirm, the owner cancels the proposal and no debt
    remains.
  consequences:
    - The client never writes to the ledger. It reads its own statement and proposes a payment. Its codigo is a read identifier plus the right to propose.
    - Two movement kinds in the book (cargo, pago) instead of three; one confirmation state instead of two; zero credit notes.
    - Four entities are born: FiadoPropuesto, PropuestaLinea, PagoPropuesto, ImputacionPago. The entity count goes from twelve to sixteen.
    - The itemisation becomes mandatory: a charge without lines cannot exist, because a figure the client cannot see broken down is not a figure the client confirmed.
    - LedgerEntry.cargo_id is gone, five constraints are gone and two partial indexes are gone.
    - The dispute-resolution capability and its four requirements (DR-01..DR-04) are deleted.
  artefacts_updated:
    - specs/client-confirmation/spec.md
    - specs/itemised-charges/spec.md
    - specs/payments-and-ageing/spec.md
    - specs/confirmation-facilitation/spec.md
    - specs/client-accounts-and-credentials/spec.md
    - specs/dispute-resolution/ (deleted)
    - requirement-index.md (48 requirements, 15 conditional, 88 scenarios; PA-04 removed)
    - design.md (all 19 sections rewritten)
    - data-model-index.md
    - task-source-index.md
    - tasks.md (69 tasks across 7 phases, phases 2 to 8; Phase 1 was delivered under the v1 plan and is not re-planned)
  requirements: 48
  tasks: 69
  tasks_completed: 69
  tasks_completed_note: >-
    Sixty-nine of the sixty-nine v2 tasks are complete: the seven of
    Phase 2, the thirteen of Phase 3, the twenty-one of Phase 4, the nine
    of Phase 5, the eight of Phase 6, the nine of Phase 7 and the two of
    Phase 8. Phase 8 delivered the two credential-boundary RED tests: the
    plaintext of a credential is in no row of any model, and a client
    request leaves behind nothing but its own proposal; and the
    credential is unique in the shop, one ACTIVE credential exists per
    customer, and a rotation really rotates - the old value stops
    resolving. The figure excludes the seven v1 Phase 1 tasks, which were
    delivered under the v1 plan, stay valid exactly as they are and are
    therefore not re-planned here. With the seven v1 Phase 1 tasks the
    change as a whole is 76 tasks, 76 complete.
  invalidates_delivered_work: >-
    Phase 1 of the delivered v1 work stays valid as is. Phase 2 is invalidated
    - the entity set, five constraints and two partial indexes change. Phase 3
    is partly invalidated - five of its nine modules change. Phases 4 to 7 were
    never delivered and are re-planned against the v2 contract.
  next_work_unit: >-
    The v2 plan is CLOSED: all sixty-nine of its tasks are complete and
    merged. The N5 gate was then OPENED by the owner - a product
    decision under a declared hypothesis, not field evidence - and that
    is the Phase 9 slice. The ACCOUNT REWRITE is Phase 10: five slices,
    and **ALL FIVE are delivered** - the person's account (10.1), the
    shop's login (10.2), the link with consent (10.3), the
    consolidation per shop (10.4) and the counter with the fiado
    (10.5) - plus the Slice 10.6, which retired the credential and
    made the person the only one who can owe. **The rewrite is
    CLOSED.** The person owns her account and her credentials, she is
    a client of SEVERAL shops, the shop asks and she answers, and she
    accepts or refuses the fiado from her own account.
    **The validation round with shop owners is NOT PURSUED** - the
    owner has decided so, and the knowledge base stays a declared
    design hypothesis that is not waiting for anything.
    **THERE IS NO NEXT WORK UNIT: THE PROJECT IS DELIVERED.** What
    follows is therefore NOT a slice, and what is left is WORK that nobody
    has asked for - on the record so that it is remembered, not pending:
    (1) **there is NO route left in `501`**, and there is nothing to
    build. `suspension/` - lifting a suspension, which is PA-08 - answers
    200, 403 and 404, and its service (`services.anular_suspension`) was
    already there and tested: only the route was missing, and now it is
    not. The other two are GONE: `existencias/` was cut by the owner on
    '2026-11-26' (Regla 6 is a declared cut and CP-07 is declared
    not-built), and `clientes/{id}/codigo/` was the credential the 10.6
    retired, so it disappeared instead of being built;
    (2) **the project's own delivery is DONE**: the README, the memoria
    (whose sections 3.1-3.8 are the eight capabilities) and the 30-minute
    defence script - all three delivered on '2026-11-26';

    (3) **the credential's DESIGN history still reads in the present
    tense** - §5's body, D2-D4, D9, CAC-09 and the RED suite - and §12's
    leak list and §16's traceability name its decisions. §5 now says at
    its head that the credential is retired, and that is ON PURPOSE:
    they are the record of what was decided, not a claim about what the
    system does. The `StockMovement` table stays too - empty, and nothing
    writes to it, because dropping it would be a destructive migration for
    nothing;

    (4) **and one thing nobody should have to fix again**: the documents
    now have tests that pin them to the code - the route table against the
    API map and the entity table against the models, in both directions
    and with the count. That is what stops the drift from coming back;
    (3) **nothing else is a DECISION**: the owner's last open question -
    design section 19, item 7, whether the person may see her own
    `credit_limit` - was ANSWERED on '2026-11-25'. **She does**: her own
    `credit_limit` and her own `antiguedad_max_dias`, per shop, on an
    accepted link, and nowhere else. D11, ADR-24, CAC-10 and the §7.2
    and §9.2 lists were amended, and the guarantee now runs on the
    routes that run.
  deploy_fix_2026_11_24:
    completed: '2026-11-24'
    pull_requests: [38, 39]
    the_deploy_failed: >-
      Render's build ran `migrate --noinput` and died with
      `cannot CREATE INDEX "tienda_perfiltienda" because it has pending
      trigger events`. **The cause was an ATOMIC migration that writes
      rows.** The `0004` does three things in one transaction: the
      `AddField('perfiltienda.shop')` - whose FK index is DEFERRED to
      the end of the migration, because the column does not exist yet -
      the `CreateModel`, and the `RunPython`, which **writes rows** into
      `tienda_perfiltienda` by creating the business profile of every
      shop that has staff. PostgreSQL refuses to `CREATE INDEX` while
      the transaction has pending trigger events, and those rows ARE
      pending trigger events.
    it_only_failed_on_the_deploy: >-
      **The local database had no shop with staff.** The `RunPython`
      found nothing to write, there were no pending trigger events, and
      the index was created without trouble. The deploy database had the
      demo's data, so it wrote, and the index could not be created. **A
      migration is not proved by a database that has nothing in it** -
      the data is the part that can break it.
    the_fix: >-
      `atomic = False` on the `0004` - and on the `0006`, which had the
      SAME latent bug: its `AddField('customer.user')` also defers the
      index and its `RunPython` also writes rows. The `0005` already had
      it, for the equivalent reason (`ALTER TABLE` with pending trigger
      events). The `0006` had it on the `RunPython` but NOT on the
      Migration class, which is why the test caught it.
    the_stale_test: >-
      The e2e asserted a **403** for the `dependiente` on
      `/api/v1/clientes/`, but the **N5 gate is OPEN** - the owner's
      Phase 9 decision: the `dependiente` READS the credit book, and
      `ClientesView` carries `SoloPersonal`, which admits both roles.
      The test was written when the `dependiente` was refused everywhere
      and was never inverted when the gate opened - the Phase 9 tests
      were, this one was not. It now asserts what the contract says: the
      `dependiente` reads the book (200, reduced schema, no policy) and
      is refused on the OWNER'S POLICY - the catalogue, the proposed
      payments, the limit, the suspension, the credential.
    the_verification_that_was_missing: >-
      The WHOLE chain against a database **with the demo's data**: it
      applies, **no row is lost** - the ledger rows stay attached to
      their customer - the links come out `aceptado` with their limit,
      the `0006` links the person whose alias is her username and leaves
      the other alone, the chain reverses and applies again, and the
      **whole deploy command** (`migrate` + `seed_demo`) works and works
      **twice**.
    evidence: >-
      580 integration and unit tests plus the **11 e2e tests against the
      live deployment** pass: 591 in total. The deployment answers with
      TLSv1.3, the owner's login works, and the role matrix was checked
      against the real service - the `dependiente` gets 200 on
      `/api/v1/clientes/` and 403 `permiso_insuficiente` on
      `/api/v1/catalogo/` and `/api/v1/pagos-propuestos/`.
    files:
      - backend/tienda/migrations/0004_miembro_de_tienda.py
      - backend/tienda/migrations/0006_customer_es_la_persona.py
      - backend/tests/integration/test_migracion_con_datos.py
      - backend/tests/e2e/test_public_url.py
  counter_identification_decided:
    decided: '2026-11-24'
    decided_by: the owner
    what_the_owner_said: >-
      The QR identification in the shop and the identification by
      username **as it was originally posed** are both NOT NEEDED. For a
      client to get a fiado, it is enough that she tells the attendant
      which client she is - with her username, for example - and the
      attendant identifies her, IF she really is on the shop's list of
      trusted clients. The attendant then makes the fiado and the
      client confirms it from her own interface.
    what_that_means_in_code: >-
      **The flow the owner describes is the one that is implemented.**
      The counter searches by the USERNAME ALONE
      (`GET /api/v1/mostrador/buscar/?username=...`), and the search
      only finds a person who is on THAT shop's list of trusted clients
      - the filter is `estado="aceptado"` on the `Vinculo`, and it is
      the same filter the owner's own customer list uses. The
      attendant prepares the fiado (`POST /api/v1/propuestas/`, whose
      `cliente_de_la_tienda` demands the same `aceptado` link), and the
      client accepts or refuses it from her own account
      (`POST /api/v1/cuenta/fiados/aceptar/`). **No QR is involved, and
      the counter never asks for a password.**
    the_qr_is_closed_not_deferred: >-
      The QR was never implemented - it only ever appeared in the
      decisions digest as an ALTERNATIVE that was rejected ("Native
      mobile app, QR/barcode scanning | The credential is typed"). So
      this decision does not remove anything: it records that the
      alternative is CLOSED, and it stops the record from listing it as
      an open question.
    the_old_posing_is_closed_too: >-
      The identification "as it was originally posed" is the version
      where the person typed her PASSWORD at the counter. That version
      was never in the design or the proposal: the design's own
      decisions digest says "The credential is typed; the surface is a web
      page", and the counter's search asks for a public name and
      nothing else. **What the owner describes IS the old posing
      corrected**: she says who she is, the shop identifies her, and
      the answer to the fiado is hers.
    what_is_left_of_the_old_mechanism: >-
      The `codigo` credential - the `CustomerCodigo` with its six-symbol
      prefix - is still alive, but it is NOT the counter's mechanism
      any more: the route that would ISSUE it
      (`/api/v1/clientes/{id}/codigo/`) is still a stub, and the only
      reader of a credential is the CLIENT'S OWN STATEMENT
      (`/app/cliente`), which is a THIRD audience and not the shop's
      counter. So the counter and the credential do not meet, and
      nothing has to be removed for this decision to hold.
    the_password_is_never_asked_for: >-
      The search asks for the username ALONE, and a body that carries a
      password is REFUSED with `campo_no_admitido` - not ignored, because
      an error that is ignored in silence happens again. **That the
      owner does not see what she types is a SUPPOSITION OF THE
      PROCESS, not a technical guarantee**: the attendant is behind the
      counter and she is in front of it, and the code guarantees the
      other half - the counter's search never authenticates anybody.
    evidence: >-
      The flow was verified against the deployed service: the search
      answers 200 for a trusted client of the shop, a POST carrying a
      password answers 422 `campo_no_admitido`, the person's routes
      answer 403 without a person's session, and the eleven e2e tests
      pass against the live deployment.
