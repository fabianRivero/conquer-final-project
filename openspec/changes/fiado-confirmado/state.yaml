    the_login_is_three_questions: >-
      Which shop - the owner's list of the shops he owns; a `dependiente`
      has one, so his list has one entry and the step disappears. Which
      role - the owner, or one of the staff the shop gave a user; the
      owner may act AS a `dependiente`, and then he writes **that
      member's own credentials**, so the row that records the act says
      the member acted. Which credentials - username and password.
    the_username_needs_no_shop_name: >-
      Each shop gives its own users, and a username is **globally
      unique** - it is Django's. A `dependiente` who works in two shops
      has **two** users, one per shop, and each login resolves exactly
      one shop. That is why the login asks for no shop name.
    only_the_owner_gives_staff: >-
      Administrating the staff is the shop's POLICY - the same policy as
      the `credit_limit` and the catalogue - and the N5 gate did not
      open it. The `dependiente` operates the counter.
    the_data_migration: >-
      Each `(shop, user)` of `Shop.usuarios` becomes a membership, with
      the role the Django group carried. **And the business is CREATED
      when it does not exist**: a shop that has staff has a business, and
      the membership names it. A person in two shops gets one membership
      per shop, and the role **may differ** between them - something the
      global group could never express. The migration has its own test:
      it runs against a database in the OLD state and asserts what it
      produced.
    evidence: >-
      128 unit and 542 integration tests pass. The migration applies
      with data, reverses to zero and applies again. The frontend
      typecheck and the bundle build pass.
    what_this_slice_does_not_touch: >-
      The `Customer` and its `shop_id` - the Slice 10.4. The link between
      the person and a shop - the Slice 10.3. The counter's flow - the
      Slice 10.5.
