      The slice is atomic in the way the ODD protocol describes: the
      model, the migration WITH its data, the service layer, the routes,
      the screen and the tests are ONE behaviour - the consent of the
      client - and a PR with the model without the routes reaches
      nothing. It also rewrites the fixtures of fourteen test modules,
      because every fixture that built a client of a shop now builds a
      LINK to a shop.
    the_client_is_a_person: >-
      The `Customer` loses `shop_id` and `credit_limit`: **she belongs
      to no shop**, and the `Vinculo` says she is a trusted client of
      one. That is what lets her hold debt in SEVERAL shops, which is
      what the owner asked for. The limit moved to the link because the
      trust is the OWNER'S and it is of THAT shop: Ana may have 100 in
      one and 30 in another, and both numbers are true at the same time.
      The uniqueness of the alias moved from `(tienda, alias)` to
      `(alias)`: the alias identifies the PERSON, not a row of a shop's
      list.
    the_consent_is_hers: >-
      **The shop asks; she accepts or rejects from her own account.** The
      owner cannot answer for her: he does not have her credentials, and
      he must not decide for her. A pending link shows **only the shop's
      name and the two buttons** - if she saw the debt and the ageing
      first, the consent would be a formality, because she would already
      have seen everything the "yes" reveals.
    the_owner_deletes_without_asking: >-
      The removal is the OWNER's act and she does not consent to be
      removed. Her debts and her history **stay** - the book is
      append-only - but the trust goes, and there can be no new fiados.
      And the re-integration goes through a pending again: **the consent
      does not come back on its own**.
    the_data_migration: >-
      Every customer of a shop becomes an ACCEPTED link with the limit
      they had: a customer of a shop is one the shop already trusted, and
      the migration must not turn it into a question the owner would
      have to answer again. And the people are MERGED by alias: two shops
      could have two different "Ana"s, and now there is ONE Ana - her
      rows move to the first - and the limit that survives is the
      **STRICTEST** one, because the owner trusted her less in one of
      the two, and that number is the honest one.
    the_demo_deletion_changed: >-
      The person no longer hangs off the shop by a direct FK, so the
      demo deletion removes her when she is left **without a link** - and
      if she has another link, **she stays**, because she is not the
      demo's.
    the_states: >-
      `pendiente`, `aceptado`, `rechazado`, `eliminado`. The rejection
      is free text and may be empty. `eliminado` is terminal.
    evidence: >-
      128 unit and 563 integration tests pass on main after the merge,
      and `makemigrations --check` detects no change. The migration
      applies **on a FRESH database**, and on a database WITH DATA: the
      two "Ana"s merge into one person, the links are accepted with
      their limits, the old columns are gone and the link's `tienda_id`
      is NOT NULL. The frontend typecheck and the bundle build pass.
    what_this_slice_does_not_touch: >-
      The ageing that is PER SHOP, and the derivations that still read
      the shop off the client - the Slice 10.4. The counter's flow and
      the client's own account - the Slice 10.5.
