    the_rules_are_reused_not_reimplemented: >-
      The price of a line is `domain.charges.precio_unitario_de`, the
      line total is `domain.charges.total_de_linea`, the itemisation is
      `domain.charges.propuesta_amount_matches`, the transition is
      `domain.confirmation.propuesta_transicion_permitida`, and the
      suspension is `domain.evaluation.evaluate_customer` through
      `estado_de`. The service converts rows to plain values and calls the
      rules; it decides no rule of its own. domain/ was NOT touched by
      this slice.
