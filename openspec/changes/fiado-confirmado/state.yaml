product_decisions:
  - id: reframe-project
    status: confirmed
    by: user
    decision: >-
      The project is replanned from scratch. The fiado confirmed by the client
      becomes the central product, not an addendum to `tienda-barrio`.
  - id: change-identity
    status: confirmed
    by: user
    decision: >-
      New change `fiado-confirmado`. It supersedes `tienda-barrio`, whose
      proposal, specs and design are abandoned rather than amended.
  - id: inventory-depth
    status: confirmed
    by: user
    decision: >-
      Inventory is tracked by movement: a product catalogue with prices, charge
      lines on every cargo, and stock derived from recorded movements.
  - id: client-statement-reading
    status: confirmed
    by: user
    decision: >-
      The client's statement shows confirmed charges in full detail (product,
      quantity, price, confirmation date and time). An unconfirmed charge
      appears as a summary row (date + amount) with a "Confirmar" action, and
      its itemisation is revealed only inside that action. The client always
      sees what they owe; the literal alternative would let the client's own
      page understate the debt.
  - id: research-lane
    status: confirmed
    by: user
    decision: >-
      No external research lane is selected. The owner interviews remain the
      only evidence for the fiado practice, exactly as in the previous change.

