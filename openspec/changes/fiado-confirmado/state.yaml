      means. Third, two tests stamped their charges in the FUTURE, and a
      charge in the future is not part of the outstanding at the payment's
      instant - so the rule 19 bound was computed on the wrong set. The
      rule was right and the stamps were wrong. Fourth, the
      `proponer_pago` operation did not set the shop, and the model's
      NOT NULL constraint caught it.
    the_recursion_and_the_wiring: >-
      The authentication class reads the request through
      `request._request`, the plain Django request under the DRF wrapper.
      DRF's `request.user` and `request.headers` are LAZY: the first
      access calls `_authenticate()`, which calls the authenticator
      again. Reading either from inside `authenticate()` is an infinite
      recursion - and the first version of this class did exactly that,
      and the symptom was a `RecursionError` on every client request.
    not_delivered_by_this_slice: >-
      The OBJECT-level rule of the N5 gate - that a `dependiente` reaches
      the proposal IT prepared and no other - is NOT implemented, and it
      is NOT this slice's work. The Phase 5 record said it was Phase 6's
      work, and that was WRONG: no task of the plan opens the gate. Task
      5.6 states the rule conditionally, and neither Phase 6 nor Phase 7
      nor Phase 8 owns the opening. The gate is a decision under a
      DECLARED HYPOTHESIS (design 18.3): the validation round with the
      shop owners has not been run, so the conditional capability stays
      absent from the code until its evidence gate closes - and its
      absence IS the flag. The opening is a DECISION, not a task, and it
      belongs to the validation round.
