      anyone noticing.
    the_polling_contract: >-
      The board polls `/api/v1/posicion/` every 20 seconds, and the poll
      doubles as the keep-alive (ADR-10). The CLIENT's page does not
      poll: a poll would multiply the credential's exposure for no
      benefit.
    the_credential_stays_in_the_state: >-
