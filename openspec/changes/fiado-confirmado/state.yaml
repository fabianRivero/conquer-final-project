    Task Completion Gate of sdd-archive is legitimately blocked: 71 tasks
    remain unchecked and neither apply-progress nor verify-report exists,
    because no implementation ran. The change therefore stays an ACTIVE
    change at openspec/changes/fiado-confirmado/ with its 20 files committed
