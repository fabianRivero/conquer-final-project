  open_decision: null
  no_customer_credit:
    decided: '2026-11-07'
    by: user
    rule: >-
      A pago never exceeds the debt it retires. The shop returns the excess as
      change and it never enters the book, so no customer credit can exist.
    encoding:
      - 'design section 3.2 rule 19, with the error code pago_excede_deuda'
      - 'design section 4 ADR-26'
      - 'design section 3.1 never-stored list, which forbids a customer credit'
      - 'design section 12.2 landmine 15, a customer credit creeping back'
      - 'design section 10: outstanding is never negative and the allocation never leaves a residual'
      - 'specs/payments-and-ageing: PA-01 and PA-02 rewritten, 83 to 85 scenarios'
    rejected_alternative: >-
      Allowing a pago larger than the debt and holding the difference as a
      balance in the client's favour. It would have resurrected a whole
      capability - a credit to age, to limit, to reconcile and to explain - and
      a stored credit is a derived value in a design whose section 3.1 forbids
      derived values.
    consequence: >-
      The outstanding is never negative, the ageing buckets always sum exactly
      to the outstanding, and there is no credit state anywhere in the system.
      The Allocation record keeps its residual field so a caller has one shape
      to read, and it is always zero.
  imputation_model:
    decided: '2026-11-07'
    by: user
    decision: >-
      The PagoPropuesto names NO charge (option C). The client proposes an
      amount and the FIFO decides which debts it retires. The repartition is
      RECORDED, not recomputed: a new entity ImputacionPago holds one row per
      (payment, charge) pair, with the grain of the CHARGE.
    worked_example: >-
      A client owes 8,00 of bread, 7,00 of soda and 15,00 of biscuits, in that
      order, and pays 20,00. The payment writes three imputations - 8,00, 7,00
      and 5,00 - and the charges read 8/8, 7/7 and 5/15.
    grain: charge
    rejected_alternatives:
      - >-
        A mutable pagado column on the charge. It breaks the append-only
        guarantee of the book and is a stored derived value, which section 3.1
        forbids and landmine 12 polices.
      - >-
        Recomputing the repartition on read. The numbers would move if the FIFO
        rule ever changed, and a credit book cannot do that.
      - >-
        Naming the target charge on the PagoPropuesto. The client does not
        choose which debt it pays, so the proposal names no charge.
      - >-
        The grain of the CargoLinea. The design defines no policy for splitting
        a partial payment across the lines of one charge, and it does not need
        one: the desglose says what was bought, the debt says what is owed and
        the repayment says what was paid against the debt.
    consequences:
      - The entity count goes from fifteen to sixteen.
      - A payment writes its LedgerEntry(pago) and its ImputacionPago rows in one transaction.
      - 'Two new transactional rules: 20 (the pair names a cargo and a pago) and 21 (the imputations add up to the payment and no charge is over-imputed).'
      - 'The client statement carries pagado and saldo per charge, both derived on read.'
      - The error code cargo_no_indicado is gone; the vocabulary drops to seventeen.
      - Rule 19 is reworded: the bound is the customer's total outstanding, not one charge's.
    encoding:
      - 'design section 3: the ImputacionPago entity'
      - 'design section 3.1: append-only, and why the repartition is recorded'
      - 'design section 3.2: rules 20 and 21'
      - 'design section 4 ADR-27'
      - 'design section 9.1: the propose route loses cargo_id'
      - 'design section 9.2: pagado and saldo on the client serializer'
      - 'design section 10: the Imputacion record, imputations_of and ChargeState.saldo'
      - 'design section 13.3: the payment flow'
      - 'specs/payments-and-ageing PA-02 and specs/client-confirmation CC-02 and CC-07, 85 to 88 scenarios'
  gates:
