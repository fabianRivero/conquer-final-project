v2_redesign:
  recorded: '2026-11-07'
  brief: openspec/changes/fiado-confirmado/redesign-brief.md
  decision: >-
    The dispute machinery and the nota de credito are removed. The problem the
    old change solved - the two sides do not have the same figure - is now
    solved by PREVENTION instead of resolution: the owner prepares a fiado
    with its desglose, the client sees it on a screen in the shop and
    confirms it, and only then does the charge exist and become debt. If the
    client does not confirm, the owner cancels the proposal and no debt
    remains.
  consequences:
    - The client never writes to the ledger. It reads its own statement and proposes a payment. Its codigo is a read identifier plus the right to propose.
    - Two movement kinds in the book (cargo, pago) instead of three; one confirmation state instead of two; zero credit notes.
    - Four entities are born: FiadoPropuesto, PropuestaLinea, PagoPropuesto, ImputacionPago. The entity count goes from twelve to sixteen.
    - The itemisation becomes mandatory: a charge without lines cannot exist, because a figure the client cannot see broken down is not a figure the client confirmed.
    - LedgerEntry.cargo_id is gone, five constraints are gone and two partial indexes are gone.
    - The dispute-resolution capability and its four requirements (DR-01..DR-04) are deleted.
  artefacts_updated:
    - specs/client-confirmation/spec.md
    - specs/itemised-charges/spec.md
    - specs/payments-and-ageing/spec.md
    - specs/confirmation-facilitation/spec.md
    - specs/client-accounts-and-credentials/spec.md
    - specs/dispute-resolution/ (deleted)
    - requirement-index.md (48 requirements, 15 conditional, 88 scenarios; PA-04 removed)
    - design.md (all 19 sections rewritten)
    - data-model-index.md
    - task-source-index.md
    - tasks.md (69 tasks across 7 phases, phases 2 to 8; Phase 1 was delivered under the v1 plan and is not re-planned)
  requirements: 48
  tasks: 69
  tasks_completed: 30
  tasks_completed_note: >-
