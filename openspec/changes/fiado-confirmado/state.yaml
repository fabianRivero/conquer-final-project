    lines_note: >-
      The count is the AUTHORED lines: the frontend's own sources, the
      login, the URL map, the tests and the workflow. The
      `package-lock.json` is NOT counted - it is 1828 lines of a
      GENERATED dependency tree, not code anyone wrote. It IS committed,
      because `npm ci` installs from it and a build that is not
      reproducible is not a build; but it is pinned, not authored.
    why_exception: >-
      The unit is atomic: the frontend's sources are the contract, and the
      tests read them. A pull request with the tests without the sources
      would assert nothing.
    evidence: >-
      128 unit and 303 integration tests pass - 21 of them new. The build
      succeeds, the bundle lands in `STATIC_ROOT` and its URL answers 200
      - landmine 2.
    the_login_the_plan_did_not_have: >-
      The design's route table says the staff surfaces answer "302 to
      login", and the staff scope is "the `shop_id` written at login" -
      but NO TASK of the plan creates the route that writes it. The staff
      surface cannot work without it, so it lives here, with the shell it
      enables.

      It writes exactly ONE shop into the session: a `User` may belong to
      several `Shop` rows through `Shop.usuarios`, but a session names
      exactly one, and `current_shop(request)` reads that one and
      nothing else. It authenticates with Django's own machinery, it
      needs the CSRF token - it is a session-writing POST - and it
      refuses a user with no shop, because a session that carries no
      scope would look like a login and behave like a refusal.
    the_same_origin_contract: >-
      `http.ts` is the ONLY place a URL is built, and it refuses any
      absolute URL - a path that names a scheme or starts with `//`. The
      refusal is a THROWN error and not a silent correction: a silent
      correction would hide the mistake, and the mistake is the whole
      threat - a request that goes to another host carries the session
      cookie to a host that does not own it.

      The two audiences differ in ONE place and the difference is the
      point: the staff sends `credentials: 'same-origin'` and the client
      sends `credentials: 'omit'`, because the client holds no session
      and sending one would blur the two scopes (ADR-4).
    the_bundle_is_build_output: >-
      The bundle is NOT committed. It is rebuilt by `npm --prefix frontend
      run build`, and the CI now builds it - otherwise the test that
      asserts the bundle's URL answers 200 would SKIP, and a skipped
      test is not evidence.
    proof_non_vacuous: >-
      Ten probes, each failing the test it should: the login not writing
      the `shop_id`, the login accepting any password, the staff surface
      not redirecting, the client surface redirecting, `http.ts`
      accepting an absolute URL, the client sending the cookies, the
      client not sending the credential's header, the router losing a
      route, the security policy relaxed, and the build writing
      somewhere else. All ten were detected.
    the_defects_the_probes_and_the_build_found: >-
      Three, and they are worth recording because two of them were real
      bugs that would have shipped. First, the Vite build wrote into
      `backend/staticfiles` while `STATIC_ROOT` is `REPO_ROOT /
      "staticfiles"` - the repository root's directory, not the
      backend's. The bundle would have landed where WhiteNoise does not
      look, and the test that compares the two paths caught it. Second,
      the SPA served the bundle with `serve_static(request,
      str(index))` - Django's `serve()` takes the path of the file
      RELATIVE to `document_root`, so passing the file as the path made
      it look for a file named after the directory, inside that
      directory, and the route answered a 500. It was invisible until
      the bundle existed for the first time, because the placeholder
      answered instead. Third, and in the TESTS: the assertions on the
      frontend's source read the DOCSTRINGS too, and a docstring that
      mentions `"omit"` while explaining that the client does NOT send
      it made the assertion pass for the wrong reason. The tests now
      strip the comments and read the code.
