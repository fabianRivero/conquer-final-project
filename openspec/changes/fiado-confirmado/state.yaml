      accepted from a cookie, the credential accepted from a URL
      parameter, the statement carrying another customer's charges, the
      proposal writing a ledger row, the validation writing a recomputed
      amount, rule 19 not being checked, the proposal accepting a
      `cargo_id`, the second validation not being refused, and the
      repartition not being recorded. All nine were detected.
    the_defects_the_tests_found: >-
      Four, and all four were in the TESTS or in the wiring, not in the
      rules. First, the credential never arrived: `APIClient.credentials()`
      builds an HTTP authentication header, not a custom one, so every
      client request was a request with no credential. The header travels
      as `HTTP_X_CODIGO`, which is what the Phase 4 suite already used.
