closure:
  decided: '2026-10-30'
  decision: keep-active
  reason: >-
    The owner chose to stay in planning. sdd-apply was never launched, so the
    Task Completion Gate of sdd-archive is legitimately blocked: 71 tasks
    remain unchecked and neither apply-progress nor verify-report exists,
    because no implementation ran. The change therefore stays an ACTIVE
    change at openspec/changes/fiado-confirmado/ with its 20 files committed
    on main, not an archived one. Its state is honest: the planning is
    complete and the implementation is pending.
  archive_status: >-
    Blocked by the Task Completion Gate, not by an error. sdd-verify and
    sdd-archive both report blocked, which is the correct state for a change
    that was planned but never implemented. The archive was neither forced nor
    bypassed.
  to_continue_implementation: >-
    sdd-apply is ready: dependencies.apply reports ready, blockedReasons is
    empty and the 71 tasks are ready to execute. Under the resolved
    feature-branch-chain strategy it implements PR 1 only (Foundation, 7
    tasks), with a gentle-ai sdd-attempt acquire/settle pair per work unit.
    Each later PR targets the immediately previous PR branch.
  artifacts_committed:
    - 96687e3
    - d2e5114
    - 0274234
    - bb7c458
  remaining_for_the_pfm:
    - The application itself: no backend/, no frontend/, no requirements.txt exists yet.
    - The README, the memoria section 3.1-3.8 and the 30-minute defence script.
    - The validation instrument evidence-annex.md, whose 70 fields stay PENDING.
  superseded: >-
    The closure decision was taken when no implementation had run. The owner
    later authorised sdd-apply and the first slice was delivered as three
    chained pull requests. The 'planning only' record above is the history of
    that decision, not the current state: the current state is
    implementation-in-progress, with 7 of 71 tasks complete.

knowledge_basis:
  declared: '2026-10-29'
  mode: design-hypothesis
  statement: >-
    The change is built on a declared design hypothesis about the shop credit
    practice, not on field evidence. No interview with shop owners was run for
    this variant. The four Regla gates are therefore design decisions under
    hypothesis, not interview findings: Regla 4 builds the client surface,
    Regla 5 builds the catalogue and CargoLinea, Regla 6 keeps
    existencias_registradas as an optional ceiling, and N5 leaves the
    conditional facilitation capability out of scope.
  cut_mechanism: >-
    The reduction mechanism stays live. A future validation round that
    contradicts any gate applies exactly the cut described in design §19: a
    Regla-4 cut reduces the scope to fiado desglosado, a Regla-5 cut removes
    Producto and CargoLinea with the whole product-catalogue spec directory,
    and a Regla-6 cut removes StockMovement with CP-07. Regla 6 cannot be cut
    while Regla 5 survives, because StockMovement to Producto is a PROTECT
    foreign key.
  instrument: >-
    evidence-annex.md is retained as a validation instrument that was NOT
    executed. Every one of its fields stays PENDING and it contains no quote,
    figure or answer. The instrument's checklist and its Reglas are annotated
    as not executed.
  artefacts_changed:
    - proposal.md
    - evidence-annex.md
    - design.md

