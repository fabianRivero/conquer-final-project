      and the cause was not the CSRF: it was the API's default
      `IsAuthenticated` permission, which cannot apply to a route whose
      job is to authenticate. The refusal that looked like a security
      check was the framework asking for a session the route had not
      created yet.
    what_this_slice_does_not_touch: >-
