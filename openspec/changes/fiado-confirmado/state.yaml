      The gate is a NAMED decision, not an `if` repeated in four views:
      `api/gates.py` holds `N5_ABIERTA = False` and the `PuertaN5`
      permission reads it. While it is closed the `dependiente` reaches
      NONE of the four proposal routes - preparing included - because
      design 18.3 says the conditional capabilities are absent from the
      code until their evidence gate closes, so their absence IS the
      flag. When it opens, the change is one constant and no view is
      touched.
    the_lock: >-
      The proposal row is locked with `select_for_update()` while it is
      confirmed or cancelled. The transition is one-way, and two
      confirmations of the same proposal must not both pass the state
      check: the second transaction waits on the lock and then reads the
      state the first one wrote, and refuses with `propuesta_ya_confirmada`.
      The database's partial uniques - one pending proposal per customer,
      one confirmation per charge - back this up, but the lock is what
      makes the check-then-write atomic.
