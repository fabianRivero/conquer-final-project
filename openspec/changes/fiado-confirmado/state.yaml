    why_exception: >-
      The slice is atomic in the way the ODD protocol describes: the
      model, the migration, the permissions, the schemas and the tests
      are ONE behaviour - the `dependiente` operates the counter - and a
      PR with the model without the permission reaches nothing. The
      change also touches the Phase 2 model and the Phase 5 rules,
      which the protocol calls out as high risk.
    the_decision: >-
      The owner decided that the `dependiente` prepares, confirms and
      collects. It is a **product decision under a declared hypothesis**,
      not field evidence: the validation round with the shop owners has
      not been run, and the project's `knowledge_basis` stays
      `design-hypothesis`. The decision changes the capability, not the
      base.
    the_two_kinds_of_act: >-
      A proposal is a PERSONAL act: who prepared it is who closes it,
      and `FiadoPropuesto.user_id` is the ownership that says so. A
      payment is a SHOP act: anybody at the counter collects, on any
      debt, whoever originated it. The two rules are different because
      the two acts are different - and that is what resolves what looked
      like a contradiction in the owner's instructions.
    what_the_gate_opened: >-
      The four proposal routes, with the ownership filter on each: a
      `dependiente` confirms and cancels only the proposals IT prepared,
      and the refusal for somebody else's is a **404**, not a 403,
      because a 403 would confirm that the proposal exists. The gate
      opens the ROUTE; the ownership filter guards the OBJECT. They are
      two different questions, answered in two different places.
    what_the_gate_did_not_open: >-
      The owner's POLICY: the `credit_limit`, the ageing, the suspension,
      the credential and the catalogue stay the owner's. The
      `dependiente` READS the credit book through a REDUCED schema -
      `ClienteDependienteSerializer` declares the alias, the outstanding
      and the charges, and it does NOT declare `credit_limit`,
      `antiguedad_max_dias`, `suspended_reason`, `codigo` or `prefix`.
      The reduced payload is not the owner's payload with fields
      removed: it is a different schema, so a field that is not declared
      cannot appear whatever the query returns.
    the_model_changed_in_three_ways: >-
      `Confirmacion.facilitado_por_id` became `Confirmacion.confirmado_por_id`
      (NOT NULL - the row always names its actor, and there is no case
      where the name is missing); `Confirmacion.origen` carries
      `tienda`/`dependiente` instead of `tienda`/`facilitado`, because
      the third actor that `facilitado` named does not exist in this
      model - the client confirms on its own screen and no route brings
      the two principals together; and `FiadoPropuesto.facilitado_por_id`
      is gone, because `user_id` already says who prepared it. The
      partial UNIQUE `(customer_id) WHERE estado='pendiente'` is gone
      too: **a customer may have several pending fiados at once**,
      because the client buys on credit more than once and each
      proposal is its own purchase.
    the_migration_loses_no_data: >-
      Until the gate opened, the ONLY user who could confirm was the
      owner, and the owner wrote the charge in the same transaction - so
      every existing `Confirmacion` has `facilitado_por` NULL and the
      backfill is `cargo.user`, which is the same person. The column
      was added nullable, backfilled, and only then made NOT NULL. The
      removed proposal column held no data at all.
    the_error_code_that_died: >-
      `facilitador_invalido` guarded a `facilitado_por` that named a
      user outside the shop or outside the `dependiente` group. With
      `confirmado_por` the actor IS the acting session - the server
      stamps it - so there is nothing to validate and no code to refuse
      with. The vocabulary loses one code.
    evidence: >-
      128 unit and 501 integration tests pass. The RED was observed
      first: 19 failed and 3 passed before the implementation, and the
      3 that passed were the ones asserting the owner KEEPS its own
      rights - which is the direction the change did not touch.
    the_tests_that_were_inverted: >-
      Five in the Phase 5 file and one in the leak walk asserted the
      `dependiente`'s 403 over the proposal routes. They were INVERTED,
      not deleted, and the inversion carries the ownership: the Phase 5
      file now asserts that the `dependiente` prepares, confirms and
      cancels its OWN proposal, and that it reaches NOBODY else's -
      with a 404.
    the_defect_the_inversion_found: >-
      The `dependiente` that records a payment needs a debt to pay:
      rule 19 refuses a payment larger than the outstanding, so the
      first version of the matrix test saw a 422 and read it as a
      refusal of the capability. The test was wrong - it needed a debt
      first - and the 422 was the RULE working. It is the same lesson
      the Phase 5 slice recorded: a status code alone cannot tell
      "refused" from "nothing to pay".
