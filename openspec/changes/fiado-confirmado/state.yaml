  deploy_fix_2026_11_25:
    completed: '2026-11-25'
    pull_requests: [45, 46, 47]
    what_happened: >-
      The 10.6 deploy failed **three times**, and each failure was a
      different bug. The first two were the SEED's, and the third was
      the MIGRATION's.
    the_seed_could_not_delete_the_owner: >-
      `Customer.created_by` is **PROTECT**: a row that says "the owner
      created me" makes the database REFUSE to delete the owner - and
      the seed deletes the owner's account every time it rebuilds the
      demo. The demo's row had been created by the OLD seed, with
      `created_by` = the owner, and **the customer table no longer hangs
      off the shop** - the 10.4 took away `Customer.shop_id` -, so the
      demo's deletion did not reach it and the row survived with the
      block. The seed blew up, the build blew up, and the deployment
      kept the previous version. **The person is the AUTHOR of her own
      row**, and that is what makes the deletion possible.
    the_person_entered_and_reached_nothing: >-
      The `0008` created the `User` but **not the `PerfilCliente`**, and
      `EsClienteConVinculo` demands the profile: the person signed in
      and every route of her own answered 403. The profile is what says
      "I am a client in the world of credit" - an account without one
      is a person's account, and the person has not said she buys on
      credit yet: that is the link, and the link is hers to answer.
      **The `0008` was already applied in Neon, so it was NOT touched** -
      editing an applied migration is rewriting history - and a `0009`
      gives the missing profile.
    the_demo_is_deterministic: >-
      The demo's client is always `ana`, wherever the database comes
      from: if her account has another name it is renamed, and the
      leftovers of an earlier demo - the accounts that point at nobody -
      are removed. **Two accounts for one person is one person too many**,
      and the 10.6 is about exactly that.
    the_lessons_about_my_own_tests: >-
      Two of them, and they are worth more than the bugs: (1)
      `SESSION_COOKIE_SECURE = not DEBUG` - with `DEBUG` off the session
      cookie only travels over HTTPS - so my local test over HTTP talked
      to the server WITHOUT the cookie and everything answered 403; **the
      code was right and the test was wrong**, and the only way to see it
      was to read the server's log instead of keeping on assuming. (2)
      The person signs in at `/api/v1/cuenta/login/` and the staff at
      `/login/`; **mixing the two sessions breaks both**, and that is not
      a defect - it is the design.
    evidence: >-
      561 integration and 128 unit tests pass, and the flow was verified
      against the live deployment. The three failures each left a test
      that pins them: the demo's password opens the person's account and
      she has ONE account; her row says she authored it, and deleting
      the owner with that row present is REFUSED; and she has her client
      profile.
