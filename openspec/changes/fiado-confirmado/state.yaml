      Each charge carries `pagado` and `saldo`, derived on read from the
      `ImputacionPago` rows and never stored on the charge: a mutable
      column would break the append-only guarantee of the book and would
      be a stored derived value, which design 3.1 forbids (ADR-27).
      Against charges of 8,00, 7,00 and 15,00 with a payment of 20,00,
      the statement reads 8/8, 7/7 and 5/15, with 10,00 still owed.
    the_client_never_writes_to_the_book: >-
      This is the v2 invariant that replaces the v1 dispute tests: a
      client request creates no `LedgerEntry`, no `CargoLinea`, no
      `Confirmacion` and no `FiadoPropuesto`. The only row a client
      request may create is its own `PagoPropuesto`. And the proposal
      NAMES NO CHARGE: the body carries `importe` and `referencia` only,
      and a body carrying a `cargo_id` is refused on the presence of the
      field (ADR-27).
    the_proposed_payment_is_a_request_not_a_scope: >-
      The `PagoPropuesto` writes no ledger row; only the owner's
      validation creates the `pago` and its `ImputacionPago` rows. The
      amount is EXACTLY the proposal's `importe` - never recomputed, never
      rounded. Rule 19 holds: a proposed amount larger than the
      customer's outstanding is refused with `pago_excede_deuda`, writes
      no `pago`, and leaves the proposal `pendiente` - the owner rejects
      it and returns the excess as change (ADR-26).
    the_credential_is_resolved_by_the_authentication_layer: >-
      DRF's `EsCliente` permission reads `request.cliente`, and a
      permission runs AFTER the authentication, so the credential has to
      be resolved by something that runs earlier. `api/client_authentication.py`
      is that thing: it resolves the credential, attaches the customer to
      the request, and refuses a presentation that does not work with
      `422 codigo_invalido` - the same answer an unknown, a revoked and a
      throttled credential get, so the throttle is not an oracle.
    proof_non_vacuous: >-
