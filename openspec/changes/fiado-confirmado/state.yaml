      and the SURFACE asks the payload which shape it is instead of
      inventing the difference. A component that read a field the other
      role does not get would be either a crash or a leak.
    the_server_derives_and_the_client_shows: >-
      The board does NOT compute anything: the equation's three figures
      come from the API, and the ladder is NOT re-sorted - the API
