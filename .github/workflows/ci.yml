name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: unit and integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fiado
          POSTGRES_PASSWORD: fiado
          POSTGRES_DB: fiado_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # The integration suite runs on PostgreSQL 16, never SQLite: SQLite does
      # not exercise `select_for_update`, partial unique indexes or CHECK
      # constraint semantics (landmine 7).
      DATABASE_URL: postgres://fiado:fiado@localhost:5432/fiado_test
      # The service container serves no TLS. Neon does require it, so the
      # default stays `require` and the CI opts out explicitly.
      DATABASE_SSLMODE: disable
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost:8000
      # The CI runner serves plain HTTP and terminates no TLS, so the HTTPS
      # redirect stays off here. The deployment sets it through the platform
      # configuration instead.
      SECURE_SSL_REDIRECT: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The frontend bundle is BUILD OUTPUT and it is not committed, so
      # the CI builds it: the test that asserts the bundle's URL answers
      # 200 - landmine 2 - would otherwise SKIP, and a skipped test is
      # not evidence.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the frontend dependencies
        run: npm --prefix frontend ci

      - name: Build the frontend bundle
        run: npm --prefix frontend run build

      # The Django configuration arrives in this PR, so the full system check
      # can run: `manage.py check` loads `backend/config/settings.py` and
      # reports no issues. PR 1a could only check the version, because the
      # settings module did not exist yet.
      - name: Django project check
        run: python backend/manage.py check

      - name: Unit suite (no database, by construction)
        run: python -m pytest backend/tests/unit -q

      - name: Integration suite (PostgreSQL 16)
        run: python -m pytest backend/tests/integration -q

  # The e2e suite runs against the DEPLOYED public URL, and it is a
  # SEPARATE job on purpose: the integration suite must run against the
  # test database, and the e2e against production. Mixing them would
  # make the integration suite depend on a deployment being up.
  #
  # `PUBLIC_URL` is a repository variable. Without it the suite SKIPS -
  # loudly, the way the keepalive workflow does - and a skipped test is
  # not evidence, so the step says so.
  e2e:
    name: e2e against the deployed URL
    runs-on: ubuntu-latest

    env:
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "False"
      SECURE_SSL_REDIRECT: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: The e2e suite (the deployed public URL)
        run: python -m pytest backend/tests/e2e -q
